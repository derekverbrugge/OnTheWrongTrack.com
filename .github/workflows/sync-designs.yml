name: Sync Train Sim World designs
on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
permissions:
  contents: write
concurrency:
  group: sync-tsw-designs
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install calendar parser
        run: npm install --no-save --no-package-lock ical.js
      - name: Sync private Google Calendar
        env:
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
        run: node scripts/sync-designs.mjs
      - name: Commit changed designs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designs.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync TSW design gallery from calendar"
            git push
          fi
