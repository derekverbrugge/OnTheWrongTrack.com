name: Sync Train Sim World designs
on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install icalendar
      - name: Sync private calendar
        env:
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
        run: python scripts/sync_designs.py
      - name: Commit changed designs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designs.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync TSW design gallery from calendar"
            git push
          fi
