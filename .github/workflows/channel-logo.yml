name: Update YouTube channel logo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade yt-dlp Pillow
      - run: python scripts/update_logo.py
      - name: Commit logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/youtube-logo.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Update website logo from YouTube channel avatar"
            git push
          fi
